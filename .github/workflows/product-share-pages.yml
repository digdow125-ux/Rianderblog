name: Refresh product share previews
on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
  push:
    paths:
      - "index.html"
      - "promotion-hub/index.html"
      - "scripts/generate-product-share-pages.cjs"
      - ".github/workflows/product-share-pages.yml"
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Generate product-specific social preview pages
        run: node scripts/generate-product-share-pages.cjs
      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add share/
          git diff --cached --quiet || (git commit -m "Refresh product share preview pages" && git push)
