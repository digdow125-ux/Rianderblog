
<!-- RIANDERBLOG CUSTOMER DASHBOARD -->
<!-- Add this section immediately before the closing </div> of the main container,
     after the existing Customer Account section. -->

<section id="dashboard" class="auth">
  <h2>👤 My Customer Dashboard</h2>
  <p id="dashboardStatus">Checking your account...</p>
  <div id="dashboardDetails"></div>
  <button onclick="showDashboard()">Refresh Dashboard</button>
  <a href="#cart">Go to My Shopping Cart</a>
</section>

<script>
async function showDashboard() {
  const status = document.getElementById("dashboardStatus");
  const details = document.getElementById("dashboardDetails");

  const { data, error } = await db.auth.getUser();

  if (error || !data.user) {
    status.textContent = "You are not signed in.";
    details.innerHTML = '<p>Please sign in to view your dashboard.</p>';
    return;
  }

  const user = data.user;
  const itemCount = cart.reduce((sum, item) => sum + item.quantity, 0);

  status.textContent = "Welcome to RIANDERBLOG!";
  details.innerHTML = `
    <p><strong>Email:</strong> ${escapeHTML(user.email || "")}</p>
    <p><strong>Account status:</strong> ${user.email_confirmed_at ? "Verified" : "Not verified"}</p>
    <p><strong>Products in your cart:</strong> ${itemCount}</p>
    <p><strong>Member since:</strong> ${new Date(user.created_at).toLocaleDateString()}</p>
  `;
}

showDashboard();

db.auth.onAuthStateChange(() => {
  showDashboard();
});
</script>
